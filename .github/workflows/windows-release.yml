name: Windows Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, contoh v1.0.3"
        required: true
        default: "v1.0.3"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Install UI dependencies
        working-directory: ui-design
        run: pnpm install --frozen-lockfile

      - name: Build React UI
        run: pnpm run build:ui

      - name: Verify Electron UI asset paths
        shell: pwsh
        run: |
          $html = Get-Content -Raw ui-design\dist\index.html
          if ($html -notmatch 'src="./assets/') {
            Write-Error "Vite production assets are not relative. Electron file:// packaging would produce a blank screen."
            exit 1
          }
          Write-Host "Electron UI asset path check passed."

      - name: Install bundled Playwright Chromium
        shell: pwsh
        run: |
          if (Test-Path playwright-browsers) {
            Remove-Item -Recurse -Force playwright-browsers
          }
          $env:PLAYWRIGHT_BROWSERS_PATH = "$env:GITHUB_WORKSPACE\playwright-browsers"
          pnpm exec playwright install chromium

      - name: Build Windows EXE
        run: npx --yes electron-builder@26.15.7 --win nsis portable --x64 --publish never

      - name: Show build output
        shell: pwsh
        run: |
          Get-ChildItem -Path release -File |
            Select-Object Name, Length

      - name: Smoke test packaged Windows EXE
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path release\win-unpacked -Filter "BotWatcherDashboard.exe" |
            Select-Object -First 1

          if (-not $exe) {
            Write-Error "Executable Electron hasil unpack tidak ditemukan."
            exit 1
          }

          Write-Host "Menjalankan smoke test: $($exe.FullName)"

          $process = Start-Process `
            -FilePath $exe.FullName `
            -ArgumentList "--smoke-test-account-manager" `
            -Wait `
            -PassThru `
            -WindowStyle Hidden

          Write-Host "Smoke test exit code: $($process.ExitCode)"

          if ($process.ExitCode -ne 0) {
            Write-Error "Packaged AccountManager smoke test gagal dengan exit code $($process.ExitCode)."
            exit $process.ExitCode
          }

          Write-Host "Packaged AccountManager smoke test passed."

      - name: Prepare release tag from package version
        id: release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"

          git fetch --tags --force

          if (git tag --list $tag) {
            Write-Host "Tag $tag sudah ada. Release baru tidak dibuat."
            "created=false" >> $env:GITHUB_OUTPUT
            "tag=$tag" >> $env:GITHUB_OUTPUT
            exit 0
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag $tag
          git push origin $tag

          Write-Host "Tag $tag berhasil dibuat dan dipush."
          "created=true" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        if: |
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' &&
           github.ref == 'refs/heads/main' &&
           steps.release.outputs.created == 'true')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.version || steps.release.outputs.tag }}
          name: BotWatcher Dashboard ${{ github.event_name == 'workflow_dispatch' && inputs.version || steps.release.outputs.tag }}
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.yml
            release/*.blockmap
